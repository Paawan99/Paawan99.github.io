<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Assessment Tool | Paawan Shah</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a192f;
            color: #ccd6f6;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            color: #64ffda;
        }

        .back-link {
            color: #64ffda;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 4px;
        }

        .back-link:hover {
            background-color: rgba(100, 255, 218, 0.1);
            border-color: #64ffda;
        }

        .search-section {
            margin-bottom: 40px;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            background-color: #112240;
            border: 2px solid rgba(100, 255, 218, 0.2);
            color: #ccd6f6;
            font-size: 1rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.1);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #112240;
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            border-radius: 0 0 6px 6px;
        }

        .autocomplete-list.active {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        .autocomplete-item:hover {
            background-color: rgba(100, 255, 218, 0.1);
            color: #64ffda;
        }

        .quick-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .quick-btn {
            padding: 10px 20px;
            background-color: rgba(100, 255, 218, 0.1);
            border: 1px solid #64ffda;
            color: #64ffda;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .quick-btn:hover {
            background-color: rgba(100, 255, 218, 0.2);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8892b0;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(100, 255, 218, 0.1);
            border-top: 3px solid #64ffda;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .company-header {
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.05) 0%, rgba(100, 255, 218, 0) 100%);
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 40px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .company-info {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .company-name {
            font-size: 2rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            color: #64ffda;
        }

        .company-ticker {
            font-size: 1.3rem;
            color: #8892b0;
            font-weight: 500;
        }

        .risk-score-gauge {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .gauge-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            position: relative;
        }

        .gauge-circle.low {
            background: conic-gradient(#2ecc71 0deg, #2ecc71 216deg, rgba(100, 255, 218, 0.1) 216deg);
        }

        .gauge-circle.moderate {
            background: conic-gradient(#f39c12 0deg, #f39c12 216deg, rgba(100, 255, 218, 0.1) 216deg);
        }

        .gauge-circle.high {
            background: conic-gradient(#e74c3c 0deg, #e74c3c 216deg, rgba(100, 255, 218, 0.1) 216deg);
        }

        .gauge-inner {
            width: 100px;
            height: 100px;
            background-color: #0a192f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
        }

        .gauge-label {
            font-size: 0.85rem;
            color: #8892b0;
            margin-top: 10px;
            text-align: center;
        }

        .section {
            margin-bottom: 50px;
            background-color: rgba(100, 255, 218, 0.03);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            color: #64ffda;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(100, 255, 218, 0.2);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background-color: rgba(100, 255, 218, 0.05);
            padding: 20px;
            border-radius: 6px;
            border-left: 3px solid #64ffda;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #8892b0;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #64ffda;
            margin-bottom: 8px;
        }

        .metric-detail {
            font-size: 0.8rem;
            color: #8892b0;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }

        .chart-small {
            position: relative;
            height: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th {
            background-color: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(100, 255, 218, 0.2);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        tr:hover {
            background-color: rgba(100, 255, 218, 0.05);
        }

        .scenario-item {
            background-color: rgba(100, 255, 218, 0.05);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid #64ffda;
        }

        .scenario-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #64ffda;
            margin-bottom: 10px;
        }

        .scenario-prob {
            display: inline-block;
            background-color: rgba(100, 255, 218, 0.15);
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-bottom: 12px;
            color: #64ffda;
        }

        .scenario-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .scenario-detail {
            font-size: 0.9rem;
        }

        .detail-label {
            color: #8892b0;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #ccd6f6;
            font-weight: 600;
        }

        .scenario-desc {
            color: #8892b0;
            font-size: 0.9rem;
            margin-top: 12px;
            line-height: 1.5;
        }

        .news-item {
            background-color: rgba(100, 255, 218, 0.05);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .news-title {
            font-size: 1rem;
            font-weight: 600;
            color: #64ffda;
            margin-bottom: 8px;
            text-decoration: none;
            display: block;
        }

        .news-title:hover {
            color: #ccd6f6;
        }

        .news-category {
            display: inline-block;
            background-color: rgba(100, 255, 218, 0.15);
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.75rem;
            color: #64ffda;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .news-date {
            font-size: 0.8rem;
            color: #8892b0;
        }

        .hedging-suggestion {
            background-color: rgba(100, 255, 218, 0.1);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 4px;
            border-left: 3px solid #64ffda;
        }

        .hedging-title {
            font-weight: 600;
            color: #64ffda;
            margin-bottom: 5px;
        }

        .hedging-desc {
            font-size: 0.9rem;
            color: #8892b0;
            line-height: 1.5;
        }

        .error {
            background-color: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            padding: 20px;
            border-radius: 6px;
            display: none;
        }

        .error.active {
            display: block;
        }

        @media (max-width: 1024px) {

            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }

            .scenario-details {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="header">

                    <canvas id="volatilityChart"></canvas>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Value at Risk (VaR) Analysis</div>
                <table id="varTable"></table>
                <div class="chart-small">
                    <canvas id="varChart"></canvas>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Stress Testing Scenarios</div>
                <div id="stressTestingContainer"></div>
            </div>

            <div class="section">
                <div class="section-title">Latest News and Risk Analysis</div>

            </div>

            <div class="section">
                <div class="section-title">Hedging Recommendations</div>
                <div id="hedgingContainer"></div>
            </div>
        </div>
    </div>

                'Interest Rate Shock': { prob: 35, impact: 15, div: 'Minimal impact', timeline: '3 to 6 months', desc: 'Healthcare companies have stable cash flows and are less sensitive to rate changes compared to other sectors.' },
                'Regulatory Change': { prob: 45, impact: 40, div: 'Significant cuts', timeline: '12 to 24 months', desc: 'Drug pricing regulations, patent expirations, or changes to reimbursement rates directly impact profitability.' },
                'Geopolitical Crisis': { prob: 15, impact: 20, div: 'Supported', timeline: '3 to 6 months', desc: 'Healthcare demand typically remains stable but supply chain disruptions can affect drug manufacturing and distribution.' },
                'Black Swan Event': { prob: 10, impact: 30, div: 'Moderate impact', timeline: '12 to 18 months', desc: 'Major disease outbreaks or health crises could either benefit treatments or harm healthcare companies.' },
                'Patent Expiration': { prob: 20, impact: 35, div: 'Reduced', timeline: '6 to 12 months', desc: 'Loss of exclusivity on blockbuster drugs results in generic competition and significant revenue declines.' },
                'Litigation Risk': { prob: 25, impact: 25, div: 'Potential cuts', timeline: '12 to 24 months', desc: 'Product liability lawsuits or safety recalls can result in large settlements affecting cash flows.' }
            },
            'Consumer': {
                'Market Crash': { prob: 8, impact: 40, div: 'Cuts likely', timeline: '18 to 24 months', desc: 'Consumer discretionary stocks decline sharply during market crashes as spending drops significantly.' },
                'Interest Rate Shock': { prob: 30, impact: 35, div: 'Reduced', timeline: '6 to 12 months', desc: 'Higher rates reduce consumer purchasing power and increase debt servicing costs for consumers.' },
                'Regulatory Change': { prob: 20, impact: 15, div: 'Minimal', timeline: '6 to 12 months', desc: 'Labor regulations or food safety rules could increase operating costs and pressure margins.' },
                'Geopolitical Crisis': { prob: 20, impact: 30, div: 'Moderate cuts', timeline: '6 to 12 months', desc: 'International supply chain disruptions affect product availability and costs, impacting both sales and margins.' },
                'Black Swan Event': { prob: 8, impact: 45, div: 'Suspended', timeline: '18 to 24 months', desc: 'Major economic recession or consumer confidence collapse would severely impact discretionary spending.' },
                'Commodity Price Shock': { prob: 25, impact: 20, div: 'Minor cuts', timeline: '3 to 6 months', desc: 'Increases in raw material costs could compress margins if not passed through to consumers.' },
                'Consumer Sentiment': { prob: 30, impact: 35, div: 'Cut', timeline: '3 to 6 months', desc: 'Decline in consumer confidence directly impacts sales volumes and pricing power in consumer sectors.' }
            }
        };

        const HEDGING_STRATEGIES = {
            'Low': [
                { title: 'Portfolio Diversification', desc: 'Maintain diversified portfolio across sectors and geographies to reduce company specific risk.' },
                { title: 'Long Term Holding', desc: 'Conservative investors can hold long term with minimal hedging given low risk profile.' }
            ],
            'Moderate': [
                { title: 'Put Options', desc: 'Purchase put options on downside to protect against 15 to 20 percent declines in stock price.' },
                { title: 'Dollar Cost Averaging', desc: 'Gradually accumulate positions over time to reduce timing risk and volatility impact.' },
                { title: 'Sector Hedges', desc: 'Balance sector exposure with complementary positions in defensive or uncorrelated assets.' }
            ],
            'High': [
                { title: 'Put Spreads', desc: 'Buy protective puts while selling lower strike puts to reduce hedging costs significantly.' },
                { title: 'Collars Strategy', desc: 'Combine long position with put protection and short calls to create zero cost hedge.' },
                { title: 'Reduce Position Size', desc: 'Consider trimming position size and reallocating to lower volatility investments.' },
                { title: 'Short Selling and Short Calls', desc: 'Sell call options or short shares to hedge against further downside movement.' },
                { title: 'Inverse ETFs', desc: 'Use inverse ETFs in allocation to gain downside protection and offset equity market risk.' }
            ]
        };

        function initAutocomplete() {
            const input = document.getElementById('companyInput');
            const list = document.getElementById('autocompleteList');

            input.addEventListener('input', (e) => {
                const value = e.target.value.toLowerCase();
                list.innerHTML = '';
                if (value.length === 0) { list.classList.remove('active'); return; }
                const matches = Object.entries(COMPANIES).filter(([ticker, data]) => ticker.toLowerCase().includes(value) || data.name.toLowerCase().includes(value)).slice(0, 8);
                if (matches.length === 0) { list.classList.remove('active'); return; }
                matches.forEach(([ticker, data]) => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.textContent = ticker + ' • ' + data.name;
                    item.onclick = () => assessCompany(ticker);
                    list.appendChild(item);
                });
                list.classList.add('active');
            });
            document.addEventListener('click', (e) => { if (e.target !== input) list.classList.remove('active'); });
        }

        function assessCompany(ticker) {
            if (!COMPANIES[ticker]) return;
            document.getElementById('companyInput').value = ticker;
            document.getElementById('autocompleteList').classList.remove('active');
            const loadingEl = document.getElementById('loadingSpinner');
            const resultsEl = document.getElementById('results');
            const errorEl = document.getElementById('errorMessage');
            loadingEl.classList.add('active');
            resultsEl.classList.remove('active');
            errorEl.classList.remove('active');
            setTimeout(() => {
                const data = SAMPLE_DATA[ticker] || generateFallbackData(ticker);
                const company = COMPANIES[ticker];
                renderResults(ticker, company, data);
                loadingEl.classList.remove('active');
                resultsEl.classList.add('active');
            }, 1200);
        }

        function generateFallbackData(ticker) {
            const baseRisk = Math.random() * 8 + 3;
            return { price: Math.random() * 300 + 50, beta: Math.random() * 2 + 0.5, volatility30: Math.random() * 40 + 15, volatility60: Math.random() * 40 + 15, volatility90: Math.random() * 40 + 15, impliedVol: Math.random() * 35 + 15, sharpeRatio: Math.random() * 2 + 0.5, sortinoRatio: Math.random() * 2.5 + 0.8, maxDrawdown: Math.random() * 60 + 20, var95: Math.random() * 8 + 2, var99: Math.random() * 12 + 4, cvar: Math.random() * 14 + 5, riskScore: baseRisk };
        }

        function renderResults(ticker, company, data) {
            document.getElementById('companyName').textContent = company.name;
            document.getElementById('companyTicker').textContent = ticker;
            const riskScore = Math.round(data.riskScore);
            document.getElementById('gaugeValue').textContent = riskScore;
            const gaugeCircle = document.getElementById('gaugeCircle');
            gaugeCircle.className = 'gauge-circle ' + (riskScore <= 4 ? 'low' : riskScore <= 6 ? 'moderate' : 'high');
            renderRiskSummary(riskScore, company.sector);
            renderVolatilityMetrics(data);
            renderVaRAnalysis(data);
            renderStressTesting(company.sector);
            renderNews(ticker, company);
            renderHedging(riskScore);
        }

        function renderRiskSummary(riskScore, sector) {
            const summaryGrid = document.getElementById('riskSummaryGrid');
            const riskLevel = riskScore <= 4 ? 'Low' : riskScore <= 6 ? 'Moderate' : 'High';
            const riskColor = riskScore <= 4 ? '#2ecc71' : riskScore <= 6 ? '#f39c12' : '#e74c3c';
            const metrics = [{ label: 'Risk Level', value: riskLevel, detail: 'Based on volatility and beta' }, { label: 'Primary Sector', value: sector, detail: 'Industry classification' }, { label: 'Risk Trend', value: 'Stable', detail: 'Last 30 days' }];
            summaryGrid.innerHTML = metrics.map(m => '<div class="metric-card"><div class="metric-label">' + m.label + '</div><div class="metric-value" style="color: ' + (m.label === 'Risk Level' ? riskColor : '#64ffda') + '">' + m.value + '</div><div class="metric-detail">' + m.detail + '</div></div>').join('');
            const categories = [{ name: 'Market Risk', value: 35 }, { name: 'Volatility Risk', value: 25 }, { name: 'Liquidity Risk', value: 15 }, { name: 'Operational Risk', value: 15 }, { name: 'Regulatory Risk', value: 10 }];
            const ctx = document.getElementById('riskCategoryChart').getContext('2d');
            new Chart(ctx, { type: 'doughnut', data: { labels: categories.map(c => c.name), datasets: [{ data: categories.map(c => c.value), backgroundColor: ['#64ffda', '#45b7aa', '#358b7f', '#245f58', '#1a4843'], borderColor: '#0a192f', borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#ccd6f6', font: { family: "'Inter', sans-serif" } } } } } });
        }

        function renderVolatilityMetrics(data) {
            const container = document.getElementById('volatilityMetrics');
            const metrics = [{ label: 'Beta (vs S&P 500)', value: data.beta.toFixed(2), detail: 'Market sensitivity' }, { label: 'Sharpe Ratio', value: data.sharpeRatio.toFixed(2), detail: 'Risk adjusted return' }, { label: 'Sortino Ratio', value: data.sortinoRatio.toFixed(2), detail: 'Downside risk adjusted' }, { label: 'Max Drawdown', value: data.maxDrawdown.toFixed(1) + '%', detail: 'Peak to trough decline' }, { label: '30D Volatility', value: data.volatility30.toFixed(1) + '%', detail: 'Annualized' }, { label: 'Implied Volatility', value: data.impliedVol.toFixed(1) + '%', detail: 'Market expected' }];
            container.innerHTML = metrics.map(m => '<div class="metric-card"><div class="metric-label">' + m.label + '</div><div class="metric-value">' + m.value + '</div><div class="metric-detail">' + m.detail + '</div></div>').join('');
            const volatilityCtx = document.getElementById('volatilityChart').getContext('2d');
            new Chart(volatilityCtx, { type: 'line', data: { labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'], datasets: [{ label: '30D Volatility', data: [data.volatility30 * 0.95, data.volatility30 * 0.98, data.volatility30, data.volatility30 * 1.02, data.volatility30 * 1.01, data.volatility30], borderColor: '#64ffda', backgroundColor: 'rgba(100, 255, 218, 0.1)', tension: 0.4, borderWidth: 2, fill: true, pointBackgroundColor: '#64ffda', pointBorderColor: '#0a192f', pointBorderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#ccd6f6', font: { family: "'Inter', sans-serif" } } } }, scales: { y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(100, 255, 218, 0.1)' } }, x: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(100, 255, 218, 0.1)' } } } } });
        }

        function renderVaRAnalysis(data) {
            const varTable = document.getElementById('varTable');
            const parametricVar95 = data.volatility30 * 1.645;
            const parametricVar99 = data.volatility30 * 2.326;
            varTable.innerHTML = '<thead><tr><th>VaR Method</th><th>95% Confidence</th><th>99% Confidence</th><th>Interpretation</th></tr></thead><tbody><tr><td><strong>Historical VaR</strong></td><td>' + data.var95.toFixed(2) + '%</td><td>' + data.var99.toFixed(2) + '%</td><td>Based on past price movements, maximum expected loss on 1 in 20 days at 95% confidence</td></tr><tr><td><strong>Parametric VaR</strong></td><td>' + parametricVar95.toFixed(2) + '%</td><td>' + parametricVar99.toFixed(2) + '%</td><td>Assumes normal distribution, useful for quick estimates during normal market conditions</td></tr><tr><td><strong>CVaR/Expected Shortfall</strong></td><td>' + (data.var95 * 1.3).toFixed(2) + '%</td><td>' + data.cvar.toFixed(2) + '%</td><td>Average loss when worst case scenarios occur, more sensitive to tail risk than VaR</td></tr></tbody>';
            const varCtx = document.getElementById('varChart').getContext('2d');
            new Chart(varCtx, { type: 'bar', data: { labels: ['95% Confidence', '99% Confidence', 'Expected Shortfall'], datasets: [{ label: 'Value at Risk (%)', data: [data.var95, data.var99, data.cvar], backgroundColor: ['#45b7aa', '#e74c3c', '#f39c12'], borderColor: '#0a192f', borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#ccd6f6', font: { family: "'Inter', sans-serif" } } } }, scales: { y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(100, 255, 218, 0.1)' }, beginAtZero: true }, x: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(100, 255, 218, 0.1)' } } } } });
        }

        function renderStressTesting(sector) {
            const scenarios = SCENARIO_DATA[sector] || SCENARIO_DATA['Technology'];
            const container = document.getElementById('stressTestingContainer');
            container.innerHTML = Object.entries(scenarios).map(([name, data]) => '<div class="scenario-item"><div class="scenario-name">' + name + '</div><div class="scenario-prob">Probability: ' + data.prob + '%</div><div class="scenario-details"><div class="scenario-detail"><div class="detail-label">Expected Stock Impact</div><div class="detail-value">' + data.impact + '% Decline</div></div><div class="scenario-detail"><div class="detail-label">Dividend Impact</div><div class="detail-value">' + data.div + '</div></div><div class="scenario-detail"><div class="detail-label">Recovery Timeline</div><div class="detail-value">' + data.timeline + '</div></div><div class="scenario-detail"><div class="detail-label">Risk Category</div><div class="detail-value">Tail Risk Event</div></div></div><div class="scenario-desc">' + data.desc + '</div></div>').join('');
        }

        function renderNews(ticker, company) {
            const newsContainer = document.getElementById('newsContainer');
            const riskFactors = [{ title: 'Competitive Pressure', category: 'Competitive', risk: 'Medium' }, { title: 'Currency Fluctuations', category: 'Market', risk: ticker.includes('.TO') ? 'High' : 'Medium' }, { title: 'Supply Chain Resilience', category: 'Operational', risk: 'Medium' }, { title: 'Regulatory Compliance', category: 'Regulatory', risk: 'Medium' }, { title: 'Interest Rate Sensitivity', category: 'Financial', risk: 'Medium' }, { title: 'Geopolitical Exposure', category: 'Geopolitical', risk: 'Low' }];
            newsContainer.innerHTML = riskFactors.map(rf => '<div class="news-item"><span class="news-category">' + rf.category + '</span><div class="news-title">' + rf.title + '</div><div class="news-date">Risk Level: ' + rf.risk + '</div></div>').join('');
        }

        function renderHedging(riskScore) {
            const container = document.getElementById('hedgingContainer');
            const riskLevel = riskScore <= 4 ? 'Low' : riskScore <= 6 ? 'Moderate' : 'High';
            const strategies = HEDGING_STRATEGIES[riskLevel] || HEDGING_STRATEGIES['Moderate'];
            container.innerHTML = '<p style="margin-bottom: 20px; color: #8892b0;">Based on the risk assessment, here are recommended hedging strategies for ' + riskLevel.toLowerCase() + ' risk exposure:</p>' + strategies.map(s => '<div class="hedging-suggestion"><div class="hedging-title">' + s.title + '</div><div class="hedging-desc">' + s.desc + '</div></div>').join('');
        }

        initAutocomplete();
    </script>
</body>

</html>
