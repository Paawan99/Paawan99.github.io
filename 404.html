<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Paawan Shah</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #f5f5f7;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
            padding: 24px;
        }

        .wrap h1 {
            font-size: clamp(64px, 14vw, 120px);
            margin: 0;
            background: linear-gradient(135deg, #34d399, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .wrap p {
            color: #a1a1a6;
            font-size: 18px;
            margin: 12px 0 28px;
        }

        .wrap a {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            background: #f5f5f7;
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }

        .wrap a:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>404</h1>
        <p>This page doesn't exist — but the rest of the site does.</p>
        <a href="/">Back to the Hub</a>
    </div>
</body>

</html>
